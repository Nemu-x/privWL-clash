name: Update Telegram Rules

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Telegram CIDR list
        run: curl -fsSL https://core.telegram.org/resources/cidr.txt -o telegram-cidr.txt

      - name: Validate downloaded list
        run: |
          test -s telegram-cidr.txt

      - name: Sort and deduplicate CIDR list
        run: |
          grep -v '^[[:space:]]*$' telegram-cidr.txt | sort -u > telegram-cidr-sorted.txt

      - name: Generate tgprx.yaml in classical format
        run: |
          echo "# Auto-generated from Telegram official CIDR list" > tgprx.yaml
          echo "payload:" >> tgprx.yaml
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [[ "$line" == *:* ]]; then
              echo "  - IP-CIDR6,$line" >> tgprx.yaml
            else
              echo "  - IP-CIDR,$line" >> tgprx.yaml
            fi
          done < telegram-cidr-sorted.txt

      - name: Validate generated file
        run: |
          grep -q '^payload:$' tgprx.yaml || exit 1
          grep -q '^  - IP-CIDR' tgprx.yaml || grep -q '^  - IP-CIDR6' tgprx.yaml || exit 1

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tgprx.yaml
          git diff --cached --quiet && exit 0

          git commit -m "chore: update Telegram CIDR rules"
          git push
