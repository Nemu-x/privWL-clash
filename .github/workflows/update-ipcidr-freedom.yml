name: Update Freedom IPCIDR

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate ipcidr-freedom.yaml
        run: |
          curl -fsSL https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/ipsum.lst -o ipsum.lst

          python3 <<'PY'
          import ipaddress

          networks = set()

          with open("ipsum.lst", "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue

                  # на случай если в строке есть пробелы/комменты
                  line = line.split()[0]

                  try:
                      net = ipaddress.ip_network(line, strict=False)
                      networks.add(net)
                  except ValueError:
                      pass

          collapsed = list(ipaddress.collapse_addresses(networks))
          collapsed.sort(key=lambda n: (n.version, int(n.network_address), n.prefixlen))

          with open("ipcidr-freedom.yaml", "w", encoding="utf-8") as out:
              out.write("payload:\n")
              for net in collapsed:
                  out.write(f"  - '{net}'\n")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ipcidr-freedom.yaml

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update freedom ipcidr ruleset"
            git push
          fi
